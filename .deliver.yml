version: 1
app: deliveryboy-cli

defaults:
  target: release-machine

targets:
  release-machine:
    method: local
    dir: .

versioning:
  require_clean: true
  require_pushed: true
  branch: main
  tag:
    enabled: true
    name: "v{version}"
    annotate: true
    push: true
  after_tag:
    - command: ./scripts/release/publish-github.sh {version} {work}

services:
  cli:
    deployer: commands
    config:
      steps:
        - command: ./scripts/release/check.sh {version}
        - command: cargo fmt --all -- --check
        - command: cargo clippy --all-targets --locked -- -D warnings
        - command: cargo test --locked
        - command: hugo --source site --minify --destination {work}/site
        - command: ./scripts/release/build-local.sh {version} {work}
        - command: cargo publish --dry-run --locked
        - command: ./scripts/release/publish-crate.sh {version}

  published:
    enabled: false
    deployer: commands
    config:
      steps:
        - command: "true"
    verify:
      - remote_command: ./scripts/release/verify.sh
